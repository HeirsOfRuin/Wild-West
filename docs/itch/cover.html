<!doctype html>
<!-- docs/itch/cover.html: the 630x500 cover, rendered by tools/press.mjs at 2x.
     The game's own palette (src/ui/styles.css: newsprint #ece3cf, lamp-black
     #241c14, dried-blood #8e2a1c) and faces (Rye, Old Standard TT). A wanted bill
     on a plank wall: the bill is the game's thesis, and it reads at 315x250. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Rye&display=swap">
<style>
  html, body { margin: 0; width: 630px; height: 500px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(ellipse at 50% 45%, #0000 30%, #0009 100%),
      repeating-linear-gradient(90deg, #2a1f15 0 3px, #241a11 3px 104px, #1a130c 104px 107px, #2c2117 107px 158px),
      #241a11;
    font-family: "Old Standard TT", Georgia, serif;
  }
  .grain { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, #ffffff05 0 1px, #0000 1px 4px); }
  .bill {
    position: absolute; left: 115px; top: 20px; width: 400px; height: 440px;
    background: radial-gradient(ellipse at 40% 35%, #f4ecd8 0%, #ece3cf 55%, #d8c9a6 100%);
    color: #241c14; text-align: center; transform: rotate(-2.2deg);
    box-shadow: 0 10px 28px #000c, 0 2px 4px #0008;
    clip-path: polygon(0 1%, 6% 0, 18% 1.2%, 31% 0, 47% 0.8%, 62% 0, 79% 1%, 93% 0, 100% 1.5%, 99.4% 22%, 100% 47%, 99.2% 71%, 100% 98%, 88% 100%, 72% 99%, 55% 100%, 38% 99.2%, 20% 100%, 4% 99%, 0 100%, 0.7% 74%, 0 50%, 0.6% 24%);
  }
  .nail { position: absolute; left: 50%; top: 30px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #9a8a74, #3a3027 70%); box-shadow: 0 1px 2px #0009; }
  .rule { margin: 0 34px; border-top: 3px double #241c14; }
  .wanted { font-family: Rye, "Rockwell Extra Bold", Georgia, serif; font-size: 52px; letter-spacing: .08em; margin: 34px 0 8px; }
  .title { font-family: Rye, "Rockwell Extra Bold", Georgia, serif; font-size: 66px; line-height: .95; margin: 14px 0 10px; color: #8e2a1c; }
  .reward { font-weight: 700; font-size: 30px; letter-spacing: .06em; margin: 12px 0 2px; }
  .for { font-style: italic; font-size: 17px; margin: 0 52px; line-height: 1.3; }
  .place { font-weight: 700; font-size: 17px; letter-spacing: .24em; text-transform: uppercase; margin: 18px 0 0; }
  .star { position: absolute; right: 16px; top: 16px; width: 50px; height: 50px; transform: rotate(14deg); opacity: .85; }
  .foot { position: absolute; bottom: 10px; width: 100%; text-align: center; font: 700 11px system-ui, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: #cdbf9f; text-shadow: 0 1px 2px #000; }
</style></head><body>
  <div class="grain"></div>
  <div class="bill">
    <div class="wanted">WANTED</div>
    <div class="rule"></div>
    <div class="title">DEAD<br>OR ALIVE</div>
    <div class="rule"></div>
    <div class="reward">$5,000 REWARD</div>
    <div class="for">for the leader of the gang that robbed the banks and trains of Missouri</div>
    <div class="place">Missouri · 1866–1882</div>
    <svg class="star" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#8e2a1c" stroke-width="5"/><path d="M50 14 L59 39 L86 39 L64 55 L72 81 L50 65 L28 81 L36 55 L14 39 L41 39 Z" fill="#8e2a1c"/></svg>
  </div>
  <div class="nail"></div>
  <div class="foot">An outlaw game · phone or browser</div>
</body></html>
